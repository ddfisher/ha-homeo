name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch new HA or HACS requirements

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action can only validate public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The repository's description and topics are GitHub settings. HACS only needs them
          # for its default list; remove this line once they're set.
          ignore: description topics
